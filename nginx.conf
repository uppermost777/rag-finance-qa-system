# ============================================================
# Nginx 反向代理：静态前端 + /api 后端 + SSE 流式对话专用配置
# ============================================================
server {
    listen 80;
    server_name _;

    client_max_body_size 25m;          # 上传上限略大于应用的 20MB

    # 前端静态资源（Vue 构建产物）
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # 前端路由 history 模式
    }

    # SSE 流式问答：必须关闭缓冲、延长读超时、使用 HTTP/1.1
    location /api/v1/chat/stream {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 普通 API 反向代理
    location /api/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://app:8000/health;
        access_log off;
    }

    # 接口文档（演示用；生产可关闭）
    # /docs 会向 /openapi.json 拉取规范，两个路径都要转发，否则 Swagger 报
    # "Unable to render this definition"（拿到的是前端 index.html）
    location /docs {
        proxy_pass http://app:8000/docs;
    }

    location = /openapi.json {
        proxy_pass http://app:8000/openapi.json;
    }

    location = /redoc {
        proxy_pass http://app:8000/redoc;
    }
}
